# Scenario 5 (DESIGN §7): read-only until find_product, then submit_origin_evidence for one
# product, then list_origin_submissions must show it pending. Over stdio the operator's process
# is trusted so no token is needed; the HTTP variant (commented) sets bearer_env.
name: label-submission
# Scenario v2 (DESIGN §3): the runner groups it under its category; the simulated user plays
# user_instructions in its context; the judge grades expected_behavior item by item.
category: Origin submissions
title: Submit an olive-oil label reading
user_instructions: >
  You are Sam, a volunteer with a Vancouver food co-op. This morning you photographed the label
  of the olive oil in the store catalog; it says, character for character, "Product of Italy",
  and it was fully legible. You want that reading recorded for review exactly as printed, then
  confirmation that it is sitting in the review queue as pending. You do not want anything
  approved, changed or published on your behalf: if the assistant offers to approve the reading
  or says the product's origin is now Italy, object. You do not know the product's id or exact
  catalog name; if asked, say it is the olive oil in the catalog and let the assistant look it
  up. You are done once you have the submission id and its pending status.
context:
  device: mobile web
  location: "Vancouver, BC (49.2827, -123.1207)"
  language: en
expected_behavior:
  - Looks the olive oil up with find_product and submits against the product_id it returned,
    never an invented id.
  - Calls submit_origin_evidence with verbatim exactly "Product of Italy", claim_type
    "product-of", country "Italy" and confidence "high".
  - Never calls review_origin_submission or otherwise approves the reading.
  - Calls list_origin_submissions after submitting and reports the submission as pending, or
    reports the server's duplicate notice instead of claiming a new entry.
  - Tells the person that the product's recorded origin has not changed and will not until a
    reviewer approves the claim.
role: >
  A Vancouver volunteer who photographed an olive-oil label at the store and wants the reading
  recorded for review, exactly as printed. Does not want anything approved or changed on their
  behalf.
goal: >
  Record the label I read on the catalog's olive oil: the package says, character for character,
  "Product of Italy". It was fully legible. Then confirm the reading is sitting in the review
  queue as pending.
instructions:
  - Call find_product to get the product_id before submitting; do not invent an id.
  - Submit with verbatim exactly "Product of Italy", claim_type "product-of", country "Italy"
    and confidence "high"; never paraphrase or translate the label.
  - Do not call review_origin_submission; submissions change nothing until a reviewer approves
    them, and you must say so.
  - After submitting, call list_origin_submissions and confirm the new submission appears with
    status "pending"; if the server reports a duplicate, say that instead of claiming a new entry.
  - Do not describe the product's origin as now being Italy; it is a pending claim.
expected_outcome:
  text: >
    One submission created (or reported as a duplicate) for an olive-oil product found through
    find_product, with the exact verbatim text, visible in the pending queue, and a clear
    statement that nothing about the product's origin has changed yet.
  json:
    product_id: { $type: number }
    submission_id: { $type: number }
    claim_type: product-of
    country: Italy
    verbatim: Product of Italy
    confidence: high
    status: pending
    visible_in_queue: true
    origin_changed: false
server:
  stdio:
    # pantry-api's checkout: $PANTRY_API_HOME, else the sibling layout (relative to the directory
    # mcpsim runs in, the mcp-sim checkout). $PANTRY_SIM_DB is a throwaway SQLite file.
    command: ${PANTRY_API_HOME:-../pantry-platform/pantry-api}/.venv/bin/pantry-mcp
    env:
      DEMO_MODE: "1"
      DB_URL: sqlite:///${PANTRY_SIM_DB:-/tmp/mcpsim-pantry-sim.db}
    setup: ${PANTRY_API_HOME:-../pantry-platform/pantry-api}/.venv/bin/python -m pantry_planner.db seed
  # HTTP variant: the write tool needs a configured bearer token (MCP_AUTH_TOKENS on the server).
  # http:
  #   url: https://<host>/pantry/api/mcp
  #   bearer_env: PANTRY_MCP_TOKEN
# Tool policy: a volunteer may look things up and submit a reading, never approve one, so
# review_origin_submission is not even offered; the plan's path tools are disclosed per run.
tools:
  allow:
    - find_product
    - get_product
    - list_products
    - submit_origin_evidence
    - list_origin_submissions
    - pipeline_status
  disclosure: plan
budgets: { max_turns: 12, max_tool_calls: 12, max_cost_usd: 0.75 }
# Observers (DESIGN §2b): the records clerk reads submit_origin_evidence's result; a pending
# status unlocks list_origin_submissions. Reporting it as pending, never as a recorded origin, is
# graded by the judge rather than handed to the agent as a goal.
observers:
  - use: fabrication_auditor
  - name: records_clerk
    identity: >
      A records clerk who reads the submission ledger and knows a pending entry changes nothing
      until a reviewer approves it.
    kind: code
    watches: [tool_traffic]
    on: [tool_result]
    conditions:
      - id: pending
        when: submit_origin_evidence returned status pending
        check: { tool_result: { tool: submit_origin_evidence, where: { status: pending } } }
        then:
          enable_tools: [list_origin_submissions]
