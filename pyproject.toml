[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpsim"
version = "0.1.0"
description = "LLM-as-a-judge simulations for MCP servers: role, goal, instructions, expected outcome."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.122",
  "mcp>=2.0",
  "pydantic>=2.9",
  "pyyaml>=6",
  "httpx>=0.28",
  # `mcpsim ui`; both already come with the mcp SDK, listed because mcpsim imports them.
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  # tests/test_packaging.py builds the wheel without build isolation.
  "setuptools>=70.1",
]

[project.scripts]
mcpsim = "mcpsim.cli:main"

[tool.setuptools]
# The simulate skill (skills/simulate: SKILL.md, config.yaml, roles/*.md, scripts/run.sh) ships
# inside the package as mcpsim/_skills/simulate, so an installed mcpsim finds its default skill
# without the repository (mcpsim.skill.skill_dir). A new mcpsim subpackage must be listed here.
packages = ["mcpsim", "mcpsim.ui", "mcpsim._skills"]

[tool.setuptools.package-dir]
"mcpsim._skills" = "skills"

[tool.setuptools.package-data]
"mcpsim._skills" = [
  "simulate/SKILL.md",
  "simulate/config.yaml",
  "simulate/roles/*.md",
  "simulate/scripts/*.sh",
]
# The runner UI's page, stylesheet and script (`mcpsim ui`).
"mcpsim.ui" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["mcpsim"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs ANTHROPIC_API_KEY and a live pantry server; skipped in CI",
]
filterwarnings = [
  "ignore:Field name \"json\" in \"ExpectedOutcome\" shadows an attribute:UserWarning",
]
