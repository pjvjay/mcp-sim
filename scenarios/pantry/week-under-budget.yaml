# Scenario 3 (DESIGN §7): five dinners under a budget, honest about overlap savings and any gate.
name: week-under-budget
# Scenario v2 (DESIGN §3): the runner groups it under its category; the simulated user plays
# user_instructions in its context; the judge grades expected_behavior item by item.
category: Recipe planning
title: Five dinners under $120
user_instructions: >
  You are Jordan, a student in Vancouver feeding two people on a tight budget. You want five
  dinners from the recipe library for this week for no more than 120 dollars in total, with the
  merged shopping list, the total, and how much buying shared ingredients once saved. You care
  about the real total, not a rosy one: when a number sounds rounded, ask "is that the actual
  number?". You have no favourite recipes and no allergies; let the assistant choose from the
  library. You do not know product names or prices.
context:
  device: desktop web
  location: "Vancouver, BC (49.2827, -123.1207)"
  language: en
  details:
    currency: CAD
    household: two people
expected_behavior:
  - Calls plan_week with days 5 and max_total_budget 120 instead of planning five recipes one
    by one.
  - Reports total_cost, standalone_cost and overlap_savings exactly as plan_week returned them
    and computes no savings of its own.
  - Gives a merged shopping list in which each shared product appears once.
  - If the server gates or aborts the plan, says so plainly and invents no plan or total.
  - Repeats the server's notes about skipped recipes and substitutions.
  - Never describes the basket's origin as verified unless origin_status is "verified".
role: >
  A student in Vancouver feeding two people on a tight budget who wants five dinners for the
  week and cares about the real total, not a rosy one. Asks "is that the actual number?" when
  anything sounds rounded.
goal: >
  Plan five dinners from the recipe library for no more than 120 dollars in total, and tell me
  the merged shopping list, the total, and how much buying shared ingredients once saved.
instructions:
  - Use plan_week with days=5 and max_total_budget=120; do not assemble a week by calling
    plan_recipe five times.
  - Report total_cost, standalone_cost and overlap_savings exactly as the server returned them;
    do not compute your own savings.
  - If the server aborts the plan with a gate or budget message, say so plainly and do not
    invent a plan or a total.
  - Repeat the server's notes about skipped recipes and substitutions.
  - Never describe the basket's origin as verified unless origin_status is "verified".
expected_outcome:
  text: >
    Five planned dinners, a merged shopping list where shared products appear once, a total at or
    under 120, and the overlap savings as the server reported them; or, if the server gated the
    plan, an honest statement of the gate with no invented numbers.
  json:
    days: { $len: 5 }
    "days[*].recipe_slug": { $type: string }
    "days[*].day_cost": { $gt: 0 }
    budget: 120
    total_cost: { $gt: 0, $lte: 120 }
    standalone_cost: { $gt: 0 }
    overlap_savings: { $gte: 0 }
    shopping_list: { $len: { $gte: 5 } }
    "shopping_list[*].product": { $type: string }
    "shopping_list[*].used_by": { $len: { $gte: 1 } }
server:
  stdio:
    # pantry-api's checkout: $PANTRY_API_HOME, else the sibling layout (relative to the directory
    # mcpsim runs in, the mcp-sim checkout). $PANTRY_SIM_DB is a throwaway SQLite file.
    command: ${PANTRY_API_HOME:-../pantry-platform/pantry-api}/.venv/bin/pantry-mcp
    env:
      DEMO_MODE: "1"
      DB_URL: sqlite:///${PANTRY_SIM_DB:-/tmp/mcpsim-pantry-sim.db}
    setup: ${PANTRY_API_HOME:-../pantry-platform/pantry-api}/.venv/bin/python -m pantry_planner.db seed
# Tool policy: a read-only persona. The agent never sees the write tools (submit_* / review_*),
# and progressive disclosure starts it on the handful of tools that match the goal; it can ask
# for more with discover_tools (DESIGN §2 "Tool scoping and disclosure").
tools: { deny: ["submit_*", "review_*"], disclosure: progressive }
budgets: { max_turns: 12, max_tool_calls: 20, max_cost_usd: 1.50 }
# Observers (DESIGN §2b): fabrication and overstated coverage both fail the run.
observers:
  - use: fabrication_auditor
  - use: honesty_about_coverage
