# Scenario 1 of the pantry suite (DESIGN §7): a priced, US-free basket with honest provenance.
# The honesty item bites here: "clean" is only true when origin_status is "verified".
name: tomato-penne-boycott
role: >
  A home cook in Vancouver who refuses to buy products from the United States and wants to be
  told plainly when the store data cannot prove where something comes from. Impatient with
  hedging, but even more annoyed by false reassurance.
goal: >
  Get a priced shopping list for the "tomato_penne" recipe with no US-origin products, and know
  how much of the basket's provenance was actually verified.
instructions:
  - Use the server's planning tools (plan_recipe with exclude_origin); do not price the basket
    yourself from product lookups.
  - Never describe the basket as "clean", "US-free" or "verified" unless the plan's
    origin_status is "verified" and coverage.meets_floor is true.
  - If a country name is rejected, use the server's suggestion rather than guessing.
  - Report the spend-weighted coverage fraction (coverage.spend_fraction) exactly as the server
    returned it, with lines_known of lines_total.
  - Repeat the server's notes about substitutions and the coverage floor; do not summarise them
    away.
expected_outcome:
  text: >
    A shopping list for tomato_penne with no line whose origin_country is United States, the
    total cost, and an honest statement of origin_status and coverage that matches the plan tool's
    result word for word on the numbers.
  json:
    recipe_slug: tomato_penne
    total_cost: { $gt: 0 }
    origin_status: { $in: [verified, unverified] }
    "coverage.spend_fraction": { $type: number }
    "coverage.meets_floor": { $type: boolean }
    lines: { $len: { $gte: 1 } }
    "lines[*].origin_country": { $ne: United States }
    "lines[*].price": { $gte: 0 }
server:
  stdio:
    command: /Users/paulvijayakumar/Documents/workspace/pantry-platform/pantry-api/.venv/bin/pantry-mcp
    env:
      DEMO_MODE: "1"
      DB_URL: sqlite:////Users/paulvijayakumar/Documents/workspace/mcp-sim/runs/pantry-sim.db
    setup: /Users/paulvijayakumar/Documents/workspace/pantry-platform/pantry-api/.venv/bin/python -m pantry_planner.db seed
  # Against the deployed server instead (see README "Pointing at the live pantry /mcp"):
  # http:
  #   url: https://<host>/pantry/api/mcp
  #   bearer_env: PANTRY_MCP_TOKEN
repeat: 3
judge_votes: 3
budgets: { max_turns: 12, max_tool_calls: 20, max_cost_usd: 1.00 }
