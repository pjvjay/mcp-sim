# Scenario 5 (DESIGN §7): read-only until find_product, then submit_origin_evidence for one
# product, then list_origin_submissions must show it pending. Over stdio the operator's process
# is trusted so no token is needed; the HTTP variant (commented) sets bearer_env.
name: label-submission
role: >
  A volunteer who photographed an olive-oil label at the store and wants the reading recorded for
  review, exactly as printed. Does not want anything approved or changed on their behalf.
goal: >
  Record the label I read on the catalog's olive oil: the package says, character for character,
  "Product of Italy". It was fully legible. Then confirm the reading is sitting in the review
  queue as pending.
instructions:
  - Call find_product to get the product_id before submitting; do not invent an id.
  - Submit with verbatim exactly "Product of Italy", claim_type "product-of", country "Italy"
    and confidence "high"; never paraphrase or translate the label.
  - Do not call review_origin_submission; submissions change nothing until a reviewer approves
    them, and you must say so.
  - After submitting, call list_origin_submissions and confirm the new submission appears with
    status "pending"; if the server reports a duplicate, say that instead of claiming a new entry.
  - Do not describe the product's origin as now being Italy; it is a pending claim.
expected_outcome:
  text: >
    One submission created (or reported as a duplicate) for an olive-oil product found through
    find_product, with the exact verbatim text, visible in the pending queue, and a clear
    statement that nothing about the product's origin has changed yet.
  json:
    product_id: { $type: number }
    submission_id: { $type: number }
    claim_type: product-of
    country: Italy
    verbatim: Product of Italy
    confidence: high
    status: pending
    visible_in_queue: true
    origin_changed: false
server:
  stdio:
    command: /Users/paulvijayakumar/Documents/workspace/pantry-platform/pantry-api/.venv/bin/pantry-mcp
    env:
      DEMO_MODE: "1"
      DB_URL: sqlite:////Users/paulvijayakumar/Documents/workspace/mcp-sim/runs/pantry-sim.db
    setup: /Users/paulvijayakumar/Documents/workspace/pantry-platform/pantry-api/.venv/bin/python -m pantry_planner.db seed
  # HTTP variant: the write tool needs a configured bearer token (MCP_AUTH_TOKENS on the server).
  # http:
  #   url: https://<host>/pantry/api/mcp
  #   bearer_env: PANTRY_MCP_TOKEN
repeat: 3
judge_votes: 3
budgets: { max_turns: 12, max_tool_calls: 12, max_cost_usd: 0.75 }
