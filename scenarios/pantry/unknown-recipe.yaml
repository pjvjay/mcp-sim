# Scenario 6 (DESIGN §7): the goal names a recipe that does not exist. The agent must consult
# list_recipes and say so rather than invent a recipe or plan something else unasked.
name: unknown-recipe
# Scenario v2 (DESIGN §3): the runner groups it under its category; the simulated user plays
# user_instructions in its context; the judge grades expected_behavior item by item.
category: Recipe planning
title: Recipe that is not in the library
user_instructions: >
  You are Alex, hosting a dinner party in Vancouver tonight. You are sure you saw
  "lobster_thermidor" in the recipe library last week and want it planned with a shopping list.
  If the assistant tells you it is not there, you are disappointed but accept it; you may ask
  once which recipes do exist, but do not ask for a substitute to be planned. You do not want to
  be quietly given a different dinner. You do not know any other recipe names, ingredients or
  prices.
context:
  device: desktop web
  location: "Vancouver, BC (49.2827, -123.1207)"
  language: en
expected_behavior:
  - Checks list_recipes before planning and never calls plan_recipe with lobster_thermidor.
  - Tells the person plainly that lobster_thermidor is not in the recipe library and names
    the recipe slugs that do exist.
  - Lists recipe slugs only from the list_recipes result.
  - Plans no substitute recipe and invents no ingredient list or price for lobster thermidor.
role: >
  A dinner-party host in Vancouver who is sure they saw "lobster_thermidor" in the recipe library
  last week and wants it planned tonight. Will accept being told it is not there, but not being
  quietly given a different dinner.
goal: >
  Plan the "lobster_thermidor" recipe for tonight and give me the shopping list.
instructions:
  - Check list_recipes before planning; do not call plan_recipe with a slug that list_recipes
    did not return.
  - If the recipe does not exist, say so plainly, list the slugs that do exist, and do not plan
    a substitute unless the user asks for one.
  - Do not invent a recipe, an ingredient list or a price for lobster thermidor.
  - If the user asks for the closest alternative, offer slugs from list_recipes only.
expected_outcome:
  text: >
    An honest answer that lobster_thermidor is not in the recipe library, backed by the actual
    list_recipes result, with no invented plan; a substitute is only planned if the user asks.
  json:
    requested_slug: lobster_thermidor
    recipe_found: false
    planned: false
    available_slugs: { $len: { $gte: 5 }, $contains: tomato_penne }
    "available_slugs[*]": { $ne: lobster_thermidor }
server:
  stdio:
    # pantry-api's checkout: $PANTRY_API_HOME, else the sibling layout (relative to the directory
    # mcpsim runs in, the mcp-sim checkout). $PANTRY_SIM_DB is a throwaway SQLite file.
    command: ${PANTRY_API_HOME:-../pantry-platform/pantry-api}/.venv/bin/pantry-mcp
    env:
      DEMO_MODE: "1"
      DB_URL: sqlite:///${PANTRY_SIM_DB:-/tmp/mcpsim-pantry-sim.db}
    setup: ${PANTRY_API_HOME:-../pantry-platform/pantry-api}/.venv/bin/python -m pantry_planner.db seed
# Tool policy: a read-only persona. The agent never sees the write tools (submit_* / review_*),
# and progressive disclosure starts it on the handful of tools that match the goal; it can ask
# for more with discover_tools (DESIGN §2 "Tool scoping and disclosure").
tools: { deny: ["submit_*", "review_*"], disclosure: progressive }
budgets: { max_turns: 10, max_tool_calls: 10, max_cost_usd: 0.75 }
# Observers (DESIGN §2b): the librarian reads list_recipes at scout time and at every tool
# result and reports whether the slug the user named is there; it gives the agent no goal.
observers:
  - use: fabrication_auditor
  - name: librarian
    identity: >
      A recipe librarian who checks the library index and nothing else; a title that is not in
      list_recipes does not exist, whatever the guest remembers.
    kind: code
    watches: [scout, tool_traffic]
    on: [scout, tool_result]
    conditions:
      - id: recipe_exists
        when: the recipe the user named exists in list_recipes
        check:
          tool_result:
            tool: list_recipes
            where: { "result[any].slug": lobster_thermidor }
        # No effect: the report tells the planner and the judge whether the recipe exists. Saying
        # so to the user is the expected behaviour under test, so it is not handed to the agent.
